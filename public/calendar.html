</head>
<body>
  <header class="site-header">

      <nav class="site-nav">
        <ul>
        <li class="nav-dropdown">
          <button type="button" class="nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false">About</button>
          <ul class="dropdown-menu">
          <li><a href="mission.html">PTA Mission</a></li>
          <li><a href="board.html">Board</a></li>
          <li><a href="standing-rules.html">Standing Rules</a></li>
          </ul>
        </li>
        <li class="nav-dropdown">
          <button type="button" class="nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false">Get Involved</button>
          <ul class="dropdown-menu">
          <li><a href="https://mybenfranklinpta.givebacks.com/shop" target="_blank" rel="noopener">Join the PTA</a></li>
          <li><a href="volunteering.html">Volunteer</a></li>
          </ul>
        </li>
        <li><a href="calendar.html" aria-current="page">Calendar</a></li>
        <li class="nav-dropdown">
          <button type="button" class="nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false">Programs</button>

  <main class="content">
    <h1>Calendar</h1>
<p>Upcoming PTA and school events will be listed here.</p>

  </main>

  <footer class="site-footer">
    <p>Ben Franklin PTA &middot; <a href="mailto:communications@mybenfranklinpta.org">communications@mybenfranklinpta.org</a> &middot; <a href="https://www.facebook.com/mybenfranklinpta">Facebook</a></p>
  </footer>

  <script>
    document.querySelectorAll(".nav-dropdown-toggle").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var li = btn.closest(".nav-dropdown");
        var isOpen = li.classList.contains("open");
        document.querySelectorAll(".nav-dropdown.open").forEach(function (el) {
          el.classList.remove("open");
          el.querySelector(".nav-dropdown-toggle").setAttribute("aria-expanded", "false");
        });
        if (!isOpen) {
          li.classList.add("open");
          btn.setAttribute("aria-expanded", "true");
        }
      });
    });
    document.addEventListener("click", function () {
      document.querySelectorAll(".nav-dropdown.open").forEach(function (el) {
        el.classList.remove("open");
        el.querySelector(".nav-dropdown-toggle").setAttribute("aria-expanded", "false");
      });
    });
  </script>
</body>
